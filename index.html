<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Move IoT</title>
</head>
<body>
    <main>
        <h1>Step counter</h1>
        <form action="">
            <p id="age-p">Age:</p>
            <input type="number" max="120" id="age" placeholder="e.g. 24">
        </form>
        <div id="step-div">
            <p id="step-title-p">Daily step goal:</p>
            <p id="steps">5000</p>
        </div>
    </main>
</body>
</html>
