<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Move IoT</title>
</head>
<body>
    <main>
        <h1>Step counter</h1>
        <form id="step-form">
            <p id="age-p">Age:</p>
            <input type="number" max="120" id="age" placeholder="e.g. 24">
            <p id="weight-p">Weight:</p>
            <input type="number" max="300" id="weight-input" placeholder="e.g. 70">
            <p id="height-p">Height:</p>
            <input type="number" max="300" id="height-input" placeholder="e.g. 165">
            <p id="gender-p">Gender:</p>
            <select id="gender-input">
                <option value="select" selected>Select</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
            </select>
            <button type="button" id="button">Calculate</button>
        </form>
        <div id="step-div">
            <p id="step-title-p">Daily step goal:</p>
            <p id="steps">5000</p>
            <p id="bmi-p">BMI:</p>
            <p id="bmi">0</p>
            <p id="bmr-p">BMR:</p>
            <p id="bmr">0</p>
        </div>
    </main>
    <script>
        const form = document.getElementById('step-form');
        const stepsElement = document.getElementById('steps');
        const bmiElement = document.getElementById('bmi');
        const bmrElement = document.getElementById('bmr');
        const button = document.getElementById('button');

        // Listen for the 'submit' event on the form
        button.addEventListener('click', async (event) => {
            event.preventDefault(); // Prevent the default form submission behavior
            const age = document.getElementById('age').value;
            const weight = document.getElementById('weight-input').value;
            const height = document.getElementById('height-input').value;
            const gender = document.getElementById('gender-input').value;
            console.log(age + ", " + weight + ", " + height + ", " + gender);

            if (!age || !weight || !height || !gender) {
                alert('Please enter your info.');
                return;
            }

            try {
                const response = await fetch('http://127.0.0.1:5000/calculate-steps', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ age: parseInt(age), weight: parseInt(weight), height: parseInt(height), gender: gender}),
                });

                if (!response.ok) {
                    throw new Error('Failed to calculate steps');
                }

                const data = await response.json();
                console.log(data);
                stepsElement.textContent = data.steps;
                bmiElement.textContent = data.bmi;
                bmrElement.textContent = data.bmr;
            } catch (error) {
                console.error(error);
                alert('An error occurred while calculating steps.');
            }
        });
    </script>
</body>
</html>
